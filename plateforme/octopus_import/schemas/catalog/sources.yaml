# Catalogue des SOURCES de données et des modèles pré-entraînés. Confidentiel - réservé aux partenaires de travail.
# Référence unique, lue et contrôlée par `python -m agriml.catalog check` (voir ml/catalog/README.md).
# Champs :
#   kind        public_api | open_data | commercial | partner | internal | user_input | reference | pretrained
#   commercial  open (usage commercial permis) | contract (accord, abonnement ou conditions à signer)
#               | restricted (non commercial seulement) | unknown (licence non confirmée)
#   personal    none | indirect (rattachée à une parcelle ou un kit) | direct (identifie une personne)
#   identifying true si le contenu identifie la personne même après minimisation (voix)
#   coverage    couverture du Sénégal : full | partial | none | unknown
#   verified    date (AAAA-MM-JJ) de la dernière lecture de la licence sur une page publique, sinon null ;
#               une source vérifiée peut rester « unknown » si la page ne tranche pas
#   evidence    URL lue lors de la vérification (pages publiques uniquement)
# Coûts en FCFA ou en devise du fournisseur ; « hypothèse » = à valider par devis.

