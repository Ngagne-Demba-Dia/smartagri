# Intégration continue : tests, sécurité, infrastructure, web, images.
# Actions référencées par étiquette de version : les épingler par SHA de commit avant la mise en
# production (Dependabot « github-actions » maintient ensuite les SHA à jour).
name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Fusion d'une PR GitOps (overlays seuls, déjà validés en PR) : ni CI ni CD, sinon boucle
    # construction → PR → fusion → construction (voir cd.yml).
    paths-ignore:
      - "infra/k8s/overlays/*/kustomization.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.9.8"
  KUBECONFORM_VERSION: "0.6.7"
  K8S_SCHEMA_VERSION: "1.31.0"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Dépendances
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests et couverture (>= 80 %)
        env:
          APP_ENV: test
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Dépendances (cœur + tests, sans GPU ni vision)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests et couverture (>= 80 %)
        env:
          PYTHONPATH: src
        run: python -m pytest --cov=agriml --cov-report=term-missing --cov-fail-under=80
      - name: Entraînement de fumée sur données synthétiques
        env:
          PYTHONPATH: src
        run: |
          python scripts/make_synthetic.py --only yield
          python -m agriml.train --config configs/yield_regression.yaml --no-tuning --output-dir "$RUNNER_TEMP/ml-smoke"

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets dans l'historique (gitleaks)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --no-banner --exit-code 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Outils d'analyse
        run: python -m pip install pip-audit==2.7.3 bandit==1.8.0 semgrep==1.101.0
      - name: Vulnérabilités des dépendances Python (pip-audit)
        run: |
          pip-audit --strict ./backend
          pip-audit --strict ./ml
      - name: Analyse statique Python (bandit)
        run: bandit -r backend/app ml/src -ll -q
      - name: Analyse statique multi-langage (semgrep)
        run: semgrep scan --error --metrics=off --config p/python --config p/typescript --config p/secrets --config p/dockerfile

  iac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - name: terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: terraform validate (sans backend)
        run: |
          for env in prod staging; do
            terraform -chdir=infra/terraform/envs/$env init -backend=false -input=false
            terraform -chdir=infra/terraform/envs/$env validate
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        working-directory: infra/terraform
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: checkov
        run: |
          python -m pip install checkov==3.2.334 pyyaml==6.0.2
          checkov -d infra/terraform --framework terraform --quiet --compact
      - name: Règles Prometheus (synchronisation + promtool)
        run: |
          python infra/observability/render_prometheusrule.py --check
          docker run --rm -v "$PWD/infra/observability/prometheus:/p:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check rules /p/rules/platform.yml /p/rules/ml.yml
          docker run --rm -v "$PWD/infra/observability/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: Rendu kustomize + kubeconform
        run: |
          curl -fsSL -o kubeconform.tgz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf kubeconform.tgz kubeconform
          for overlay in dev prod; do
            kubectl kustomize "infra/k8s/overlays/$overlay" > "$RUNNER_TEMP/$overlay.yaml"
            # -ignore-missing-schemas : CRD absentes du catalogue (signalées dans le résumé, non bloquantes).
            ./kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version "$K8S_SCHEMA_VERSION" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "$RUNNER_TEMP/$overlay.yaml"
          done
      - name: docker compose config
        run: docker compose --env-file .env.example --profile ml --profile observability config -q

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fichier de verrouillage présent
        run: test -f package-lock.json || { echo "::error::web/package-lock.json manquant (npm install en local, puis versionner)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run i18n:check
      - run: npm run build

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.27.1"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage

  docker:
    needs: [backend, ml, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # signature cosign sans clé (OIDC GitHub → Fulcio)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: backend
            # Le Dockerfile copie le schéma (COPY --from=migrations) : contexte nommé hors de backend/.
            build-contexts: migrations=db/migrations
          - image: ml
            context: ml
          - image: mlflow
            context: infra/mlflow
          - image: web
            context: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Construction (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: ${{ matrix.build-contexts }}
          load: true
          push: false
          tags: smartagri92/${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Vulnérabilités de l'image (trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: smartagri92/${{ matrix.image }}:ci-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: SBOM SPDX (syft)
        uses: anchore/sbom-action@v0
        with:
          image: smartagri92/${{ matrix.image }}:ci-${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
      - uses: sigstore/cosign-installer@v3
        if: github.event_name == 'push'
      - name: Signature sans clé du SBOM (cosign)
        # Les images ne sont signées qu'après publication dans ECR (cd.yml) : une signature
        # cosign s'attache à un condensat de registre.
        if: github.event_name == 'push'
        run: cosign sign-blob --yes --bundle "sbom-${{ matrix.image }}.cosign.bundle" "sbom-${{ matrix.image }}.spdx.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.*
          retention-days: 30
