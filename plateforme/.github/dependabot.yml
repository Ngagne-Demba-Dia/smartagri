# Mises à jour automatiques des dépendances : une PR groupée par écosystème et par semaine.
# « cooldown » attend quelques jours avant de proposer une version publiée (protection contre les
# paquets compromis retirés rapidement). Les correctifs de sécurité restent proposés sans délai.
# Les dossiers encore absents (backend/Dockerfile, ml/Dockerfile...) produisent une erreur visible
# dans l'onglet Dependabot, sans bloquer les autres écosystèmes.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Dakar
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directories:
      - /backend
      - /ml
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react*", "eslint-config-next"]
      web-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    cooldown:
      default-days: 7
    groups:
      flutter-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directories:
      - /backend
      - /ml
      - /web
      - /infra/mlflow
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # Images de docker-compose.yml (TimescaleDB, Mosquitto, MinIO, Prometheus, Grafana, OTel).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/envs/*
      - /infra/terraform/stack
      - /infra/terraform/modules/*
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Dakar
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns: ["*"]
    commit-message:
      prefix: chore
