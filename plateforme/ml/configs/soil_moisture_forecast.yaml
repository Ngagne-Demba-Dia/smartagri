# Prévision d'humidité du sol 24/48/72 h (télémétrie telemetry.v1, un boîtier ESP32 = un groupe)
#
# 1. Compétition (score max)  : horizons horaires 1..72 en multi-sortie, LightGBM/CatBoost + réseau séquentiel
#                               (TCN/LSTM), météo prévue (MOS) en variables, ensemble pondéré sur OOF.
# 2. Production (robuste)     : ce fichier — un HistGradientBoosting par horizon sur Δ = y(t+h) − y(t),
#                               walk-forward purgé (écart ≥ 72 h), comparaison obligatoire à la persistance.
# 3. Compromis réaliste       : ce fichier + pluie prévue corrigée (agriml.forecast.weather_mos) ajoutée en
#                               variable dès qu'un flux météo est branché ; réévaluer à chaque changement de seuils.
#
# Lancer : python -m agriml.forecast.soil_moisture --config configs/soil_moisture_forecast.yaml

name: soil_moisture_forecast
data: data/synthetic/telemetry/telemetry.csv
device: device_id
time: ts
target: soil_moisture_pct
horizons: [24, 48, 72]
lags: [1, 3, 6, 12, 24]
windows: [6, 24]
exog: [air_temp_c, air_humidity_pct, pump_on, rain_mm]
static: [threshold_start_pct, threshold_stop_pct]
n_splits: 4
gap_hours: 72
params:
  max_iter: 300
  learning_rate: 0.05
  max_leaf_nodes: 31
  l2_regularization: 1.0
seed: 42
output_dir: artifacts
