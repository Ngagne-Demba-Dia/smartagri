[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agriml"
version = "0.1.0"
description = "Apprentissage automatique agronomique de la plateforme Smart Agri92 (compétition et production)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Propriétaire - confidentiel" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xgboost>=2.0",
  "pyarrow>=14",
  "pyyaml>=6",
  "joblib>=1.3",
]

[project.optional-dependencies]
boosting = ["lightgbm>=4.3", "catboost>=1.2"]
tuning = ["optuna>=3.6"]
tracking = ["mlflow>=2.12"]
vision = ["torch>=2.2", "torchvision>=0.17", "pillow>=10", "onnxruntime>=1.17", "timm>=1.0", "onnx>=1.16",
          "transformers>=4.40"]
deep = ["torch>=2.2", "tensorflow>=2.16", "keras>=3.0"]
# Client HTTP maison pour OctOpus ML (agriml.octopus.client) : aucune dépendance au paquet PyPI homonyme.
octopus = ["httpx>=0.27"]
pipelines = ["dvc>=3.50", "apache-airflow>=2.9"]
notebooks = ["nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29", "matplotlib>=3.8", "seaborn>=0.13"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agriml-train = "agriml.train:main"
agriml-predict = "agriml.predict:main"
agriml-evaluate = "agriml.evaluate:main"
agriml-export = "agriml.export:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["agriml"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N"]
ignore = ["S101", "S311"]
