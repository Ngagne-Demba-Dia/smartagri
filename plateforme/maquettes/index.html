<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SmartAgri92 — Maquette</title>
<!--
  Maquette cliquable de la plateforme web SmartAgri92 : les 13 modules de docs/10_web_ux.md.
  Confidentiel, réservé aux partenaires de travail. Fichier local : ne pas publier.
  Données fictives. Aucun appel réseau, aucune dépendance externe.
  Un seul fichier de plus de 800 lignes, par choix : il doit s'ouvrir hors ligne d'un double-clic.
  Couleurs des graphiques et de la carte vérifiées avec le validateur de palettes (voir docs/10_web_ux.md §5).
-->
<style>
:root{
  color-scheme:light;
  --bg:#f4f7f2;--card:#ffffff;--ink:#1b2a1f;--mute:#5f6f63;--line:#dfe7da;--soft:#e8f3e6;
  --g:#2e7d32;--g-ink:#ffffff;--g2:#66bb6a;
  --ok-ink:#1b5e20;--ok-bg:#e8f3e6;--warn-ink:#8a5300;--warn-bg:#fff3e0;--bad-ink:#b3261e;--bad-bg:#fdecea;--off-ink:#5f6f63;--off-bg:#eef1ed;
  --st-ok:#0ca30c;--st-warn:#fab219;--st-bad:#d03b3b;
  --s1:#2a78d6;--s2:#eb6834;--grid:#e6ece3;--axis:#c3cbbf;
  --m1:#86b6ef;--m2:#5598e7;--m3:#2a78d6;--m4:#1c5cab;--m5:#104281;
  /* Étiquettes de la carte : texte (--lN) et liseré (--hN) par classe, contraste ≥ 6 sauf classe 3 (texte blanc liseré foncé) */
  --l1:#0f1712;--h1:#86b6ef;--l2:#0f1712;--h2:#5598e7;--l3:#ffffff;--h3:#104281;--l4:#ffffff;--h4:#1c5cab;--l5:#ffffff;--h5:#104281;
  --hatch-bg:#eef1ed;--hatch-fg:#9aa69d;--road:#e6dfcf;
  --shadow:0 1px 2px rgba(20,40,25,.06),0 4px 14px rgba(20,40,25,.05);
  --hdr:58px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1712;--card:#18231b;--ink:#e6efe7;--mute:#9bb0a0;--line:#26362b;--soft:#1d2e21;
  --g:#66bb6a;--g-ink:#0f1712;--g2:#43a047;
  --ok-ink:#a5d6a7;--ok-bg:#1d2e21;--warn-ink:#ffb74d;--warn-bg:#3a2c10;--bad-ink:#ef9a9a;--bad-bg:#3a1a1a;--off-ink:#9bb0a0;--off-bg:#212e25;
  --s1:#3987e5;--s2:#d95926;--grid:#26362b;--axis:#3a4a3e;
  --m1:#184f95;--m2:#2a78d6;--m3:#5598e7;--m4:#86b6ef;--m5:#b7d3f6;
  --l1:#ffffff;--h1:#184f95;--l2:#ffffff;--h2:#104281;--l3:#0f1712;--h3:#5598e7;--l4:#0f1712;--h4:#86b6ef;--l5:#0f1712;--h5:#b7d3f6;
  --hatch-bg:#212e25;--hatch-fg:#4d5f52;--road:#2a3329;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1712;--card:#18231b;--ink:#e6efe7;--mute:#9bb0a0;--line:#26362b;--soft:#1d2e21;
  --g:#66bb6a;--g-ink:#0f1712;--g2:#43a047;
  --ok-ink:#a5d6a7;--ok-bg:#1d2e21;--warn-ink:#ffb74d;--warn-bg:#3a2c10;--bad-ink:#ef9a9a;--bad-bg:#3a1a1a;--off-ink:#9bb0a0;--off-bg:#212e25;
  --s1:#3987e5;--s2:#d95926;--grid:#26362b;--axis:#3a4a3e;
  --m1:#184f95;--m2:#2a78d6;--m3:#5598e7;--m4:#86b6ef;--m5:#b7d3f6;
  --l1:#ffffff;--h1:#184f95;--l2:#ffffff;--h2:#104281;--l3:#0f1712;--h3:#5598e7;--l4:#0f1712;--h4:#86b6ef;--l5:#0f1712;--h5:#b7d3f6;
  --hatch-bg:#212e25;--hatch-fg:#4d5f52;--road:#2a3329;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
a{color:inherit}
h1{font-size:1.5rem;line-height:1.25;margin:0}
h2{font-size:1.05rem;margin:0}
h3{font-size:.95rem;margin:0}
p{margin:.4rem 0}
:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--card);padding:10px 14px;border-radius:10px;border:1px solid var(--line)}
.skip:focus{left:8px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.sm{width:16px;height:16px}
.i.lg{width:28px;height:28px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:.85rem}

/* Ossature */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
header.top{grid-column:1/-1;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;text-decoration:none;margin-right:6px}
.brand svg{width:30px;height:30px}
.top .spacer{flex:1}
.top select,.top input{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;padding:0 10px;max-width:230px}
.top input{width:170px}
.top form{display:flex;align-items:center}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:inherit;padding:0 10px;text-decoration:none}
.count{font-size:.8rem;font-weight:700;background:var(--bad-bg);color:var(--bad-ink);border-radius:999px;padding:0 7px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--mute)}
nav.side{background:var(--card);border-right:1px solid var(--line);padding:6px 10px 24px;position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow:auto}
.grp{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:14px 10px 4px;font-weight:700}
.navlink{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 10px;border-radius:10px;text-decoration:none;color:var(--ink)}
.navlink:hover{background:var(--soft)}
.navlink[aria-current="page"]{background:var(--soft);font-weight:700;box-shadow:inset 3px 0 0 var(--g)}
.ver{margin-left:auto;font-size:.7rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-weight:600}
.sidefoot{margin:18px 10px 0;font-size:.85rem;color:var(--mute);display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.sidefoot label{display:flex;gap:8px;align-items:center;min-height:32px}
.demo{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:.85rem;color:var(--mute)}
.demo b{color:var(--ink)}
.demo select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;padding:0 8px}
.demo label{display:flex;gap:8px;align-items:center;min-height:32px}
main{padding:20px 24px 100px;min-width:0;width:100%;max-width:1320px}
.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bottom a,.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;font-size:.75rem;text-decoration:none;color:var(--ink);background:none;border:0;font-family:inherit;cursor:pointer;border-radius:10px}
.bottom [aria-current="page"]{font-weight:800;background:var(--soft)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.side{display:none}
  main{padding:16px 16px 100px}
  .bottom{display:flex}
  .hide-sm{display:none!important}
  .top select{max-width:46vw}
}

/* Composants */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.head .sub{color:var(--mute);margin:.2rem 0 0}
.crumb{font-size:.85rem;color:var(--mute);margin-bottom:4px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.stack{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.card-h .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpi .lab{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.9rem}
.kpi .val{font-size:2rem;font-weight:800;line-height:1.15;margin-top:4px}
.kpi .val small{font-size:1rem;font-weight:600;color:var(--mute)}
.kpi .sub{font-size:.85rem;color:var(--mute)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;font-size:.85rem;font-weight:700;white-space:nowrap}
.tag.ok{color:var(--ok-ink);background:var(--ok-bg)}
.tag.warn{color:var(--warn-ink);background:var(--warn-bg)}
.tag.bad{color:var(--bad-ink);background:var(--bad-bg)}
.tag.off{color:var(--off-ink);background:var(--off-bg)}
.tag.plain{color:var(--ink);background:var(--soft)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.8rem;color:var(--mute)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--g);color:var(--g-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--soft);border-color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:40px;padding:0 12px;border:0;border-right:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--soft);font-weight:800}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);margin-bottom:16px}
.banner.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.banner.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:transparent}
.banner p{margin:0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:180px}
.list li.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"tag body time acts";gap:6px 12px}
.arow>.tag{grid-area:tag;justify-self:start}.arow>.grow{grid-area:body;min-width:0}.arow>.at{grid-area:time}.arow>.acts{grid-area:acts;display:flex;gap:8px}
@media (max-width:600px){.list li.arow{grid-template-columns:auto 1fr;grid-template-areas:"tag time" "body body" "acts acts"}.arow>.at{justify-self:end}}
.meter{position:relative;height:12px;background:var(--soft);border-radius:999px;margin:10px 0 4px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--s1)}
.meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.tscroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{color:var(--mute);font-size:.8rem;font-weight:700}
.tbl td.n,.tbl th.n{text-align:right}
.tbl tr.sel td{background:var(--soft)}
.tbl tbody tr.clk{cursor:pointer}
.tbl tbody tr.clk:hover td{background:var(--soft)}
.form{display:grid;gap:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.fld{display:grid;gap:4px;min-width:140px;flex:1}
.fld label{font-weight:600;font-size:.9rem}
.fld input,.fld select,.fld textarea{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);font:inherit}
.fld input[aria-invalid="true"]{border-color:var(--bad-ink);box-shadow:0 0 0 1px var(--bad-ink)}
.hint{font-size:.85rem;color:var(--mute)}
.err{color:var(--bad-ink);font-weight:600;font-size:.9rem;min-height:1.2em;margin:0}
.okmsg{color:var(--ok-ink);font-weight:600;font-size:.9rem}
.big{font-size:2.6rem;font-weight:800;line-height:1}
.pair{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.pair:last-child{border-bottom:0}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
details summary{cursor:pointer;color:var(--mute);font-size:.85rem}

/* Graphiques */
.chart{position:relative;margin-top:6px;border-radius:8px}
.chart svg{display:block;max-width:100%;height:auto}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:.85rem;color:var(--mute);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.sw.ln{height:3px;width:18px;border-radius:2px}
.sw.band{width:18px;opacity:.25}
.sum{font-size:.9rem;color:var(--mute);margin:0 0 4px}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem;box-shadow:0 4px 18px rgba(0,0,0,.14);min-width:150px;z-index:5}
.tip strong{display:block;margin-bottom:4px}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between;white-space:nowrap}
.tip .r span:first-child{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
.chart .gl{stroke:var(--grid);stroke-width:1}
.chart .ax{stroke:var(--axis);stroke-width:1}
.chart .tk{fill:var(--mute);font-size:12px}
.chart .ref{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 4}
.chart .rl{fill:var(--mute);font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.chart .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .bandp{fill:var(--s1);fill-opacity:.12}
.chart .cross{stroke:var(--mute);stroke-width:1}
.chart .mk{stroke:var(--card);stroke-width:2}
.chart .el{fill:var(--ink);font-size:12px;font-weight:800;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.chart svg.hov .bar:not(.on){opacity:.4}
.chart .gbar{rx:4}
.hbar{display:grid;grid-template-columns:minmax(120px,1fr) 2fr auto;gap:8px;align-items:center;margin:6px 0}
.hbar .tr{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}

/* Carte */
.map .fld-p{stroke:var(--card);stroke-width:2;cursor:pointer;outline:none}
.map .fld-p:hover,.map .fld-p:focus-visible{stroke:var(--ink);stroke-width:3}
.map .lab{fill:var(--ink);font-size:15px;font-weight:800;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.map .lab2{font-size:14px;font-weight:600}
.map.compact .lab{font-size:26px;stroke-width:5px;transform:translateY(9px)}
.map.compact .lab2{display:none}
.map .road{fill:none;stroke:var(--road);stroke-width:14;stroke-linecap:round}
.map .roadlab{fill:var(--mute);font-size:11px;font-style:italic}
.map .badge{fill:var(--card);stroke-width:2}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:.85rem;color:var(--mute);margin-top:8px}
.ramp{display:inline-flex;align-items:stretch;gap:2px}
.ramp span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem}
.ramp b{display:block;width:44px;height:12px}
.ramp span:first-child b{border-radius:4px 0 0 4px}
.ramp span:last-child b{border-radius:0 4px 4px 0}
.hatch{display:inline-block;width:22px;height:12px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--hatch-fg) 0 2px,var(--hatch-bg) 2px 6px)}

/* Assistant */
.chat{display:flex;flex-direction:column;gap:10px;max-height:58vh;min-height:280px;overflow:auto;padding:4px 2px}
.msg{max-width:min(88%,640px);padding:10px 12px;border-radius:14px;white-space:pre-line}
.msg.me{align-self:flex-end;background:var(--soft)}
.msg.ai{align-self:flex-start;border:1px solid var(--line);background:var(--card)}
.msg .meta{font-size:.8rem;color:var(--mute);margin-top:6px;white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips button{min-height:40px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);padding:0 14px;font:inherit;font-size:.9rem;cursor:pointer}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:18px;max-width:min(520px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin-bottom:8px}
.photo{max-width:100%;max-height:240px;border-radius:10px;display:block;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media (forced-colors:active){.tag,.chip,.seg{border:1px solid CanvasText}.meter .fill{background:Highlight}}
</style>
</head>
<body>
<!-- Icônes au trait (inspirées du jeu Lucide), et motif hachuré « pas de mesure » de la carte -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" style="fill:var(--hatch-bg)"/><rect width="2" height="6" style="fill:var(--hatch-fg)"/>
    </pattern>
  </defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></symbol>
  <symbol id="i-report" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></symbol>
  <symbol id="i-farm" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></symbol>
  <symbol id="i-fields" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.5A3.5 3.5 0 0 0 7 18z"/></symbol>
  <symbol id="i-rain" viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 0-8 6 6 0 0 0-11.6 1.5A3.5 3.5 0 0 0 7 15zM8 19l-1 2M12 19l-1 2M16 19l-1 2"/></symbol>

    const svg = s('svg', {viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img', 'aria-label': 'Calendrier des cultures : semis et récolte prévue de chaque parcelle. Le tableau donne les mêmes dates.'});
    months.forEach(t => svg.append(s('line', {x1: X(t), x2: X(t), y1: m.t - 6, y2: H - m.b, class: 'gl'}), txt(X(t) + 4, 14, MF.format(t), 'start', 'tk')));
    fl.forEach((f, i) => {
      const y = m.t + i * rowH, a = X(Date.parse(f.sow)), b = X(Date.parse(f.harvest));
      svg.append(txt(m.l - 8, y + 19, f.code + ' · ' + f.crop, 'end', 'tk'),
        s('rect', {x: a, y: y + 7, width: Math.max(4, b - a), height: 16, rx: 4, class: 'gbar', style: 'fill:var(--s1)'}));
    });
    svg.append(s('line', {x1: X(today), x2: X(today), y1: m.t - 6, y2: H, class: 'ref'}), txt(X(today) + 4, H - 2, 'aujourd’hui', 'start', 'rl'));
    el.append(svg);
  });
  const tbl = h('details', {style: 'margin-top:8px'}, h('summary', {text: 'Voir les dates en tableau'}),
    table([{label: 'Parcelle', get: f => f.code + ' · ' + f.name}, {label: 'Culture', get: f => f.crop}, {label: 'Semis', get: f => f.sow.split('-').reverse().join('/')}, {label: 'Récolte prévue', get: f => f.harvest.split('-').reverse().join('/')}], fl, {caption: 'Calendrier des cultures'}));
  return h('section', {class: 'card'}, h('h2', {text: 'Calendrier des cultures'}), h('p', {class: 'sum', text: 'Du semis à la récolte prévue. Les plus précoces se récoltent en décembre (chou), les plus tardives en mars (oignon semé en octobre).'}), host, tbl);
}
const CANNED = [
  [/arros|eau|keur mbaye 2|p-02/i, 'Pour Keur Mbaye 2 (P-02), oui, mais pas tout de suite : le sol est à 24 %, sous votre seuil de 30 %, et la pompe est en arrêt de sécurité depuis 08:41. Faites d’abord vérifier la cuve et la crépine. Une fois la pompe réparée, arrosez environ 22 min ce soir après 18 h : ET0 de 6,1 mm et pas de pluie avant jeudi.', 'Mesures du kit SA92-000102 (09:00) · Prévision Thiès corrigée · Fiche « Irrigation de l’oignon » (FAO-56)', 'get_field_status(P-02), get_weather(P-02, 7 j), get_recommendations(P-02)'],
  [/notto|muet|alerte/i, 'Le kit de Notto 2 (P-11) n’a rien envoyé depuis 02:04. Causes les plus fréquentes : batterie faible (la batterie de Notto était à 11,6 V au dernier relais) ou téléphone relais resté hors de portée. Je n’ai donc pas de recommandation pour cette parcelle.', 'Journal des relais · Équipements de l’exploitation Notto', 'get_device_status(SA92-000111), list_alerts(org)'],
  [/seuil|bulbaison|oignon/i, 'Pour l’oignon en bulbaison sur sol sableux des Niayes, la plupart des fiches visent un démarrage vers 30 % et un arrêt vers 60 % avec votre capteur. Ces valeurs restent à ajuster parcelle par parcelle : le capteur capacitif n’est pas étalonné en humidité volumique.', 'Fiche « Irrigation de l’oignon » · Seuils actuels de vos parcelles', 'search_knowledge("oignon bulbaison seuils")'],
  [/semaine|combien/i, 'Cette semaine, vos exploitations ont apporté environ 312 m³ d’eau, estimés à partir du temps de marche des pompes. C’est 4 % de plus que la semaine précédente, à cause de la chaleur de vendredi et samedi.', 'Rapport KPI hebdomadaire', 'get_kpis(org, 7 j)']
];
function assistantReply(q) {
  if (/dose|pesticide|traitement|insecticide|fongicide|produit/i.test(q)) {
    return {text: 'Je ne donne pas de dose de produit phytosanitaire : une erreur peut nuire à votre santé, à la culture et à l’eau. Je peux transmettre votre question à un conseiller agricole, avec la photo et les mesures de la parcelle.', src: 'Règle de l’assistant', tools: 'aucun'};
  }
  const hit = CANNED.find(([re]) => re.test(q));
  return hit ? {text: hit[1], src: hit[2], tools: hit[3]} : {text: 'Dans cette maquette, je ne sais répondre qu’aux exemples proposés. En production, je réponds à partir des données de vos parcelles et des fiches techniques, et je le dis quand je ne sais pas.', src: '—', tools: 'aucun'};
}
function viewAssistant() {
  const log = h('div', {class: 'chat', role: 'log', 'aria-live': 'polite', 'aria-label': 'Conversation'},
    state.chat.map(m => h('div', {class: 'msg ' + m.who}, m.text,
      m.src ? h('div', {class: 'meta'}, h('div', {text: 'Sources : ' + m.src}), h('details', null, h('summary', {text: 'Outils appelés'}), h('code', {text: m.tools}))) : null)));
  const input = h('input', {type: 'text', maxlength: '500', autocomplete: 'off'});
  const ask = q => {
    const clean = q.trim().slice(0, 500);
    if (!clean) return;
    const r = assistantReply(clean);
    setState({chat: [...state.chat, {who: 'me', text: clean}, {who: 'ai', text: r.text, src: r.src, tools: r.tools}]});
    setTimeout(() => { const c = $('.chat'); if (c) c.scrollTop = c.scrollHeight; const i = $('#as-q'); if (i) i.focus(); }, 0);
  };
  return h('div', null,
    pageHead('Assistant IA', 'Questions en langage naturel sur vos parcelles. Réponses simulées dans cette maquette.', [h('button', {class: 'btn', type: 'button', onclick: () => announce('Conversation transmise à un conseiller (maquette).')}, icon('user'), 'Parler à un conseiller')]),
    h('section', {class: 'card'}, log,
      h('div', {class: 'chips'}, ['Dois-je arroser Keur Mbaye 2 ce soir ?', 'Pourquoi l’alerte sur Notto 2 ?', 'Quels seuils pour l’oignon en bulbaison ?', 'Combien d’eau cette semaine ?', 'Quelle dose de fongicide ?']
        .map(q => h('button', {type: 'button', onclick: () => ask(q)}, q))),
      h('form', {class: 'row', onsubmit: e => { e.preventDefault(); ask(input.value); }}, field('as-q', 'Votre question', input), h('button', {class: 'btn primary', type: 'submit'}, icon('send'), 'Envoyer')),
      h('p', {class: 'hint', text: 'L’assistant n’utilise que les données de votre périmètre. Il cite ses sources, affiche les outils appelés et ne pilote jamais la pompe. Saisie vocale en wolof prévue en V2 (application mobile).'})));
}
function csvDownload() {
  const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  const lines = [['Indicateur', 'Valeur', 'Cible', 'État'], ...KPIS.map(k => [k[0], k[1], k[2], k[4]]), [], ['Semaine', 'Eau apportée (m³)'], ...WATER8W.map((v, i) => ['S' + (36 + i), v])];
  const blob = new Blob(['﻿' + lines.map(r => r.map(esc).join(';')).join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = h('a', {href: URL.createObjectURL(blob), download: 'smartagri92_kpi_maquette.csv'});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  announce('Fichier CSV généré sur votre appareil.');
}
function viewReports() {
  const wk = WATER8W.map((_, i) => 'S' + (36 + i));
  return h('div', null,
    pageHead('Centre de rapports', 'Indicateurs de succès du pilote (docs/01_analyse_metier.md §8). Valeurs fictives.',
      [gate(h('button', {class: 'btn primary', type: 'button', onclick: csvDownload}, icon('download'), 'Exporter en CSV'), 'report.export'),
        h('button', {class: 'btn', type: 'button', disabled: true, title: 'Prévu en V2'}, 'Rapport PDF (V2)')]),
    h('div', {class: 'row', style: 'margin-bottom:16px'},
      field('rp-scope', 'Périmètre', select(state.role === 'farmer' ? [['F1', 'Exploitation Keur Mbaye']] : [['org', 'Toute l’organisation'], ...FARMS.map(f => [f.id, f.name])], state.role === 'farmer' ? 'F1' : 'org')),
      field('rp-period', 'Période', select([['8w', '8 dernières semaines'], ['camp', 'Campagne en cours']], '8w')), roleNote('report.export')),

    h('div', {style: 'margin-top:16px'}, chartCard({

      draw: (el, w) => xyChart(el, w, {labels: wk, series: [{name: 'Eau apportée', values: WATER8W, color: 's1', type: 'bar', unit: 'm³'}], yMax: 350, unit: 'm³', endLabel: true, height: 230}),
      table: {cols: [{label: 'Semaine', get: r => r[0]}, {label: 'Eau (m³)', n: true, get: r => r[1]}], rows: wk.map((x, i) => [x, WATER8W[i]])}
    })));
}
function viewEmptyOrg(route) {
  return h('div', null, pageHead(route.title, ORGS[1].name),
    h('section', {class: 'card empty'}, icon('farm', 'lg'), h('p', {text: 'Aucune exploitation dans cette organisation.'}),

/* ====================== Navigation ====================== */
const ROUTES = {
  tableau: {title: 'Tableau de bord', icon: 'home', group: 'Pilotage', view: viewDashboard},
  rapports: {title: 'Rapports et KPI', icon: 'report', group: 'Pilotage', view: viewReports},
  exploitations: {title: 'Exploitations', icon: 'farm', group: 'Terrain', view: viewFarms},
  parcelles: {title: 'Parcelles', icon: 'fields', group: 'Terrain', view: viewFields},
  carte: {title: 'Carte', icon: 'map', group: 'Terrain', view: viewMap},
  meteo: {title: 'Météo', icon: 'cloud', group: 'Terrain', view: viewWeather},
  cultures: {title: 'Analyse des cultures', icon: 'sprout', group: 'Cultures', view: viewCrops, ver: 'V1.1'},
  campagnes: {title: 'Campagnes', icon: 'cal', group: 'Cultures', view: viewCampaigns, ver: 'V1.1'},
  rendement: {title: 'Rendement', icon: 'trend', group: 'Cultures', view: viewYield, ver: 'V3'},
  recommandations: {title: 'Recommandations', icon: 'spark', group: 'IA', view: viewRecos},
  maladies: {title: 'Maladies', icon: 'leaf', group: 'IA', view: viewDisease, ver: 'V2'},
  assistant: {title: 'Assistant', icon: 'chat', group: 'IA', view: viewAssistant},
  equipements: {title: 'Équipements', icon: 'tool', group: 'Matériel', view: viewEquipment, ver: 'V1.1'},
  alertes: {title: 'Alertes', icon: 'bell', view: viewAlerts, hidden: true}
};
function parseHash() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  return {name: ROUTES[parts[0]] ? parts[0] : 'tableau', param: parts[1] ? decodeURIComponent(parts[1]) : null};
}
function navLinks(container) {
  let grp = null;
  for (const [k, r] of Object.entries(ROUTES)) {
    if (r.hidden) continue;
    if (r.group !== grp) { grp = r.group; container.append(h('div', {class: 'grp', text: grp})); }
    container.append(h('a', {class: 'navlink', href: '#/' + k, 'data-route': k}, icon(r.icon), h('span', {text: r.title}), r.ver ? h('span', {class: 'ver', text: r.ver}) : null));
  }
}
/* Commandes propres à la maquette (rôle simulé, coupure réseau) : hors de l'en-tête, qui ne montre que ce que l'application aura. */
let demoSeq = 0;
function demoControls() {
  const id = 'demo-role-' + (++demoSeq);
  const role = select(Object.keys(ROLE_LABEL).map(k => [k, ROLE_LABEL[k]]), state.role);
  role.id = id; role.className = 'demo-role';
  role.addEventListener('change', e => setState({role: e.target.value}));
  return h('div', {class: 'demo'}, h('b', {text: 'Démonstration'}),
    h('label', {for: id, style: 'min-height:0', text: 'Voir la plateforme en tant que'}), role,
    h('label', null, h('input', {type: 'checkbox', class: 'demo-offline', checked: state.offline, onchange: e => setState({offline: e.target.checked})}), 'Simuler une coupure réseau'));
}
function buildChrome() {
  const side = $('#side');
  navLinks(side);
  side.append(h('div', {class: 'sidefoot'}, demoControls(), h('span', {text: 'Maquette · données fictives · confidentiel'})));
  const more = () => {
    const box = h('nav', {'aria-label': 'Tous les modules'});
    navLinks(box);
    box.addEventListener('click', e => { if (e.target.closest('a')) box.closest('dialog').close(); });
    const cur = parseHash().name;
    box.querySelectorAll('[data-route]').forEach(a => { if (a.dataset.route === cur) a.setAttribute('aria-current', 'page'); });
    openDialog('Modules', [box, h('div', {style: 'margin-top:12px'}, demoControls())], 'Fermer', () => null);
  };
  $('#bottom').append(
    ...[['tableau', 'home', 'Accueil'], ['carte', 'map', 'Carte'], ['alertes', 'bell', 'Alertes'], ['assistant', 'chat', 'Assistant']]
      .map(([k, ic, t]) => h('a', {href: '#/' + k, 'data-route': k}, icon(ic), t)),
    h('button', {type: 'button', onclick: more}, icon('menu'), 'Plus'));
  const org = $('#org'), camp = $('#camp');
  ORGS.forEach(o => org.append(h('option', {value: o.id, text: o.name})));
  CAMPAIGNS.forEach(c => camp.append(h('option', {value: c.id, text: c.name})));
  org.addEventListener('change', e => setState({org: e.target.value}));
  camp.addEventListener('change', e => setState({camp: e.target.value}));
  $('#lang').addEventListener('change', e => setState({lang: e.target.value}));
  FIELDS.forEach(f => { $('#qlist').append(h('option', {value: f.code + ' ' + f.name}), h('option', {value: f.kit})); });
  $('#search').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#q').value.trim().toLowerCase();
    const f = q && scopeFields().find(x => (x.code + ' ' + x.name + ' ' + x.kit).toLowerCase().includes(q));
    if (f) { location.hash = '#/parcelles/' + f.code; $('#q').value = ''; } else announce('Aucune parcelle ni aucun kit ne correspond dans votre périmètre.');
  });
  $('#theme').addEventListener('click', () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
    const next = dark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('sa92-theme', next); } catch (err) { /* stockage indisponible : le thème vaut pour la session */ }
    syncThemeIcon();
  });
  new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', $('#top').offsetHeight + 'px')).observe($('#top'));
}
function syncThemeIcon() {
  const dark = getComputedStyle(document.documentElement).colorScheme.includes('dark');
  $('#theme use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
  $('#theme').setAttribute('aria-label', dark ? 'Passer au thème clair' : 'Passer au thème sombre');
}
function render(opts) {
  observers.forEach(o => o.disconnect()); observers = [];
  const {name, param} = parseHash();
  const route = ROUTES[name];
  document.querySelectorAll('[data-route]').forEach(a => { if (a.dataset.route === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  document.querySelectorAll('.demo-role').forEach(s => { s.value = state.role; });
  document.querySelectorAll('.demo-offline').forEach(c => { c.checked = state.offline; });
  const al = state.alerts.filter(a => inScope(a.field)).length;
  $('#bellcount').textContent = String(al);
  $('#bell').setAttribute('aria-label', al + ' alertes ouvertes');
  const sync = $('#sync');
  sync.replaceChildren(icon(state.offline ? 'wifioff' : 'sync', 'sm'), state.offline ? 'Hors ligne · données de 09:00' : 'À jour · il y a 3 min');
  const banners = [];
  if (state.lang !== 'fr') banners.push(h('div', {class: 'banner'}, icon('info'), h('p', {text: 'Traduction en ' + (state.lang === 'wo' ? 'wolof' : 'pulaar') + ' en attente de relecture par des locuteurs natifs : la maquette reste en français.'})));
  if (state.offline) banners.push(h('div', {class: 'banner warn'}, icon('wifioff'), h('p', {text: 'Hors ligne. Vous voyez les données de 09:00. Vos actions sont mises en file et partiront au retour du réseau.'})));
  if (state.role !== 'coop_manager') banners.push(h('div', {class: 'banner'}, icon('user'), h('p', {text: 'Vue de démonstration : ' + ROLE_LABEL[state.role] + '.'})));
  const main = $('#main');
  const scroll = window.scrollY;
  main.replaceChildren(...banners, state.org === 'o2' ? viewEmptyOrg(route) : route.view(param));
  document.title = route.title + ' — SmartAgri92 (maquette)';
  if (opts && opts.keepFocus) { window.scrollTo(0, scroll); return; }
  window.scrollTo(0, 0);
  if (opts && opts.focus) { const t = main.querySelector('h1'); if (t) t.focus(); }
}
window.addEventListener('error', e => {
  if (/ResizeObserver loop/.test(e.message)) return; // avertissement bénin du navigateur, pas une erreur de la maquette
  const m = $('#main');
  if (m) m.prepend(h('div', {class: 'banner bad', role: 'alert'}, icon('stop'), h('p', {text: 'Erreur dans la maquette : ' + e.message})));
});
try { const th = localStorage.getItem('sa92-theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (err) { /* stockage indisponible */ }
buildChrome();
syncThemeIcon();
window.addEventListener('hashchange', () => render({focus: true}));
render({});
</script>
