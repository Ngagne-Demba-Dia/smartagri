[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartagri92-backend"
version = "1.0.0"
description = "API, ingestion MQTT et tâches de la plateforme SmartAgri92 (confidentiel — partenaires)."
requires-python = ">=3.11"
license = { text = "Propriétaire — confidentiel" }
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "SQLAlchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "argon2-cffi>=23.1",
    "PyJWT>=2.9,<3",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
assistant = ["anthropic>=0.70"]
metrics = ["prometheus-client>=0.20"]
inference = ["joblib>=1.4", "numpy>=1.26", "scikit-learn>=1.5", "onnxruntime>=1.18"]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.assistant" = ["knowledge/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore:Using .httpx. with .starlette.testclient.*",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C90"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.ruff.lint.mccabe]
max-complexity = 12
