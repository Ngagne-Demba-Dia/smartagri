# Prometheus de l'environnement local (docker compose --profile observability).
# En Kubernetes, la collecte passe par les ServiceMonitors (kube-prometheus-stack) et les règles par
# l'objet PrometheusRule généré depuis rules/ (voir ../README.md).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # API FastAPI : /metrics exposé quand prometheus_client est installé (METRICS_ENABLED=true).
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # MinIO : métriques publiques en local (MINIO_PROMETHEUS_AUTH_TYPE=public dans docker-compose.yml).
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  # Collecteur OpenTelemetry : métriques reçues en OTLP, réexposées au format Prometheus.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
