# Broker MQTT local Smart Agri92 (Mosquitto 2.x).
# Local : port 1883 en clair, limité à 127.0.0.1 par docker-compose. Production : TLS 8883 uniquement
# (voir le bloc commenté en bas), identifiant = device_id, ACL par kit.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl

listener 1883 0.0.0.0

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Garde-fous : un point telemetry.v1 fait moins de 1 Ko ; on refuse les paquets démesurés.
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 1000
max_keepalive 300

# --- Production (TLS 8883) : à activer avec des certificats gérés hors dépôt ---
# listener 8883 0.0.0.0
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
