# Secret de la plateforme IA (AWS Secrets Manager <prefix>/ml), lisible uniquement par le
# external-secrets-reader de ce namespace (rôle IRSA distinct de celui du namespace applicatif).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agri-ml
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: agri-ml
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OCTOPUS_API_KEY
      remoteRef:
        key: smartagri92-staging/ml
        property: OCTOPUS_API_KEY
    - secretKey: MLFLOW_BACKEND_STORE_URI
      remoteRef:
        key: smartagri92-staging/ml
        property: MLFLOW_BACKEND_STORE_URI
    # Sel HMAC des instantanés OctOpus (agriml.octopus.exporter) et son identifiant, seul écrit dans
    # le manifeste. Changer de sel change toutes les clés pseudonymes : début de saison seulement.
    - secretKey: AGRIML_PSEUDO_SALT
      remoteRef:
        key: smartagri92-staging/ml
        property: AGRIML_PSEUDO_SALT
    - secretKey: AGRIML_PSEUDO_SALT_ID
      remoteRef:
        key: smartagri92-staging/ml
        property: AGRIML_PSEUDO_SALT_ID
