# Collecte des métriques d'inférence (contrat : infra/observability/README.md).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: inference
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
