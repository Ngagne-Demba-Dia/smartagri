# Ré-entraînement hebdomadaire (gabarit). Déclenche le pipeline agriml, qui peut déléguer
# l'entraînement à l'API OctOpus (clé OCTOPUS_API_KEY), suit l'expérience dans MLflow et dépose un
# paquet candidat sous s3://<models>/bundles/<version>/. La promotion en service reste une PR GitOps
# (configMap inference-bundle) relue par un humain : aucun modèle n'est mis en production
# automatiquement.
# Commande cible « agriml.pipelines.retrain » : le lot ML livre pour l'instant
# « agriml.mlops.retrain_flow », qui lit des fichiers locaux (--holdout, --reference, --current) ;
# il manque l'extraction des données, la source OctOpus et l'envoi au Pushgateway (voir README).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retrain
  labels:
    app.kubernetes.io/name: retrain
    app.kubernetes.io/component: ml-training
spec:
  schedule: "0 2 * * 1"
  timeZone: Africa/Dakar
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true # activé par overlay une fois le pipeline livré
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 21600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: retrain
            app.kubernetes.io/component: ml-training
            smartagri92.io/octopus: "true"
            smartagri92.io/egress-https: "true"
        spec:
          serviceAccountName: agri-ml-jobs
          automountServiceAccountToken: true # jeton IRSA (lac de données)
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: retrain
              image: smartagri92/ml:unset
              command: ["python", "-m", "agriml.pipelines.retrain", "--source", "octopus", "--register-candidate"]
              envFrom:
                - configMapRef:
                    name: ml-config
              env:
                - name: OCTOPUS_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: agri-ml
                      key: OCTOPUS_API_KEY
                # Pseudonymisation des instantanés envoyés à OctOpus (docs/09_octopus_ml.md).
                - name: AGRIML_PSEUDO_SALT
                  valueFrom:
                    secretKeyRef:
                      name: agri-ml
                      key: AGRIML_PSEUDO_SALT
                - name: AGRIML_PSEUDO_SALT_ID
                  valueFrom:
                    secretKeyRef:
                      name: agri-ml
                      key: AGRIML_PSEUDO_SALT_ID
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: work
                  mountPath: /tmp
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 10Gi
