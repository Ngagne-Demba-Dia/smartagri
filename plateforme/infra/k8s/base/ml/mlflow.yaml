# Serveur MLflow autohébergé (image infra/mlflow/Dockerfile). Métadonnées dans PostgreSQL (base
# « mlflow », URI dans le secret agri-ml), artefacts dans s3://<models>/mlflow/ via IRSA.
# MLflow 2.x n'a pas d'authentification par défaut : il n'est joignable que depuis ce namespace
# (NetworkPolicy) ou par « kubectl port-forward ». Alternative managée : Amazon SageMaker MLflow
# (supprimer alors ce fichier et pointer MLFLOW_TRACKING_URI vers le serveur managé).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: ml-tracking
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/component: ml-tracking
        smartagri92.io/egress-https: "true"
    spec:
      serviceAccountName: agri-mlflow
      automountServiceAccountToken: true # jeton IRSA (models/mlflow/*)
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: smartagri92/mlflow:unset
          imagePullPolicy: IfNotPresent
          command: ["mlflow", "server"]
          args:
            - "--host=0.0.0.0"
            - "--port=5000"
            - "--backend-store-uri=$(MLFLOW_BACKEND_STORE_URI)"
            - "--artifacts-destination=$(MLFLOW_ARTIFACTS_DESTINATION)"
            - "--serve-artifacts"
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: agri-ml
                  key: MLFLOW_BACKEND_STORE_URI
            - name: MLFLOW_ARTIFACTS_DESTINATION
              valueFrom:
                configMapKeyRef:
                  name: ml-config
                  key: MLFLOW_ARTIFACTS_DESTINATION
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: ml-config
                  key: AWS_REGION
            - name: HOME
              value: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels:
    app.kubernetes.io/name: mlflow
spec:
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
