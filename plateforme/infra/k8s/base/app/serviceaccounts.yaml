# Un ServiceAccount par charge de travail. L'annotation IRSA (eks.amazonaws.com/role-arn) est posée
# par les overlays avec les ARN de la sortie Terraform « irsa_role_arns ».
# Vague ArgoCD -3 : créés avant les secrets (-2) et le Job de migration (-1), voir migrate-job.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agri-api
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agri-ingestor
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agri-web
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
# Job de migration du schéma : aucun droit AWS (pas d'IRSA), seulement le secret agri-database-migrate.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agri-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
# Utilisé uniquement par le SecretStore d'External Secrets (jeton projeté demandé par l'opérateur).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-reader
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
