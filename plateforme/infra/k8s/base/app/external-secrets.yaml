# External Secrets Operator (API external-secrets.io/v1, ESO >= 0.16) : recopie les secrets AWS
# Secrets Manager dans des Secrets Kubernetes. Les clés distantes (smartagri92-<env>/app, /database)
# sont fixées par les overlays.
# Vague ArgoCD -2 : ArgoCD attend que ces ressources soient saines (secret recopié) avant de lancer
# le Job de migration (vague -1) puis les Deployments (vague 0).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-3
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-reader
---
# JSON attendu : JWT_SECRET, DEVICE_KEY_PEPPER, MQTT_API_USERNAME, MQTT_API_PASSWORD,
# MQTT_INGESTOR_USERNAME, MQTT_INGESTOR_PASSWORD, ANTHROPIC_API_KEY (vide si assistant désactivé).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agri-app
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: agri-app
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: smartagri92-staging/app
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agri-database
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: agri-database
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: smartagri92-staging/database
        property: DATABASE_URL
---
# Rôle propriétaire du schéma (DDL), lu seulement par le Job de migration. Même secret distant que
# agri-database, autre propriété : l'API ne reçoit jamais cette URL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agri-database-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: agri-database-migrate
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MIGRATION_DATABASE_URL
      remoteRef:
        key: smartagri92-staging/database
        property: MIGRATION_DATABASE_URL
