# Politiques réseau du namespace applicatif : tout est refusé, puis ouvert flux par flux.
# Hypothèses : Traefik dans le namespace « traefik », Prometheus dans « monitoring », base de données
# joignable sur une adresse privée (VPC, peering ou PrivateLink), broker MQTT TLS sur 8883.
# Limite : une NetworkPolicy standard filtre par IP/port, pas par nom DNS. Le port 443 sortant est donc
# ouvert vers Internet (hors métadonnées EC2) aux seuls pods étiquetés smartagri92.io/egress-https ;
# le filtrage par FQDN demande Cilium (components/egress-fqdn-cilium, qui remplace egress-https) ou un
# proxy de sortie.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: web
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: smartagri92-ml
          podSelector:
            matchLabels:
              app.kubernetes.io/name: inference
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestor
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingestor
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 5432
---
# Job de migration : aucune entrée, sortie vers PostgreSQL seulement (pas d'étiquette egress-*).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: migrate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: migrate
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api
      ports:
        - port: 8000
---
# HTTPS sortant (S3, STS, Anthropic, météo) pour les pods explicitement étiquetés.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-https
spec:
  podSelector:
    matchLabels:
      smartagri92.io/egress-https: "true"
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            # Le VPC reste joignable sur 443 : points de terminaison d'interface (STS pour IRSA, ECR,
            # Secrets Manager). Seul le service de métadonnées EC2 est exclu.
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
---
# MQTT sur TLS vers le broker (managé ou dans le VPC).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-mqtts
spec:
  podSelector:
    matchLabels:
      smartagri92.io/egress-mqtts: "true"
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 8883
