# Entrée publique via Traefik v3 (CRD traefik.io/v1alpha1) et certificats cert-manager.
# Seuls /v1 (API) et le tableau de bord sont exposés : /metrics, /docs, /healthz restent internes.
# Les hôtes sont fixés par les overlays.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ratelimit
spec:
  # Limite grossière par IP cliente, en plus des limites applicatives de l'API (par route et par compte).
  rateLimit:
    average: 100
    period: 1m
    burst: 50
    sourceCriterion:
      ipStrategy:
        depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: false
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(self), geolocation=(self), microphone=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: body-limit
spec:
  # Lots de télémétrie (≤ 1000 points) et photos de feuilles : 10 Mio maximum.
  buffering:
    maxRequestBodyBytes: 10485760
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartagri92
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      smartagri92-ratelimit@kubernetescrd,smartagri92-security-headers@kubernetescrd,smartagri92-body-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.example.invalid
        - app.example.invalid
      secretName: smartagri92-tls
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
    - host: app.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
