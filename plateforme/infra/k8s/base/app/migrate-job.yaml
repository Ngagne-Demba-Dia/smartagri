# Migrations du schéma (db/migrations, copiées dans l'image api) : python -m app.db.migrate.
# Le Job tient un verrou consultatif PostgreSQL et inscrit chaque fichier dans schema_migrations
# (backend/app/db/migrate.py) ; les migrations sont écrites pour être rejouables.
#
# Ordre ArgoCD : hook « Sync » en vague -1, et non PreSync. Les hooks PreSync passent avant toute
# ressource ; au premier déploiement, le namespace, le SecretStore et le secret agri-database-migrate
# n'existeraient pas encore et le Job resterait bloqué. Ici :
#   vague -3 : namespace, comptes de service ; vague -2 : SecretStore, ExternalSecrets ;
#   vague -1 : ce Job ; vague 0 : Deployments.
# Si une migration échoue, la synchronisation s'arrête avant les Deployments : l'ancienne version de
# l'API reste en service (elle doit fonctionner sur le schéma N, voir docs/11_deploiement.md §5).
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    # Le Job précédent reste visible (journaux) jusqu'à la synchronisation suivante.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/component: database
    spec:
      restartPolicy: Never
      serviceAccountName: agri-migrate
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Même image que l'API : l'overlay fixe l'étiquette, la PR GitOps met à jour les deux à la fois.
          image: smartagri92/api:unset
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.db.migrate"]
          env:
            # Rôle propriétaire du schéma (droits DDL), distinct du rôle de l'API ; jamais monté dans l'API.
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agri-database-migrate
                  key: MIGRATION_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
