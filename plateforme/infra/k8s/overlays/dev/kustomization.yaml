# Overlay « dev » : déployé sur le cluster de recette (compte AWS staging, APP_ENV=staging).
# Les images viennent du registre ECR partagé du compte prod ; la CD met à jour les étiquettes ici.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: smartagri92/api
    newName: 111111111111.dkr.ecr.eu-west-3.amazonaws.com/smartagri92/api
    newTag: 0.0.0-placeholder
  - name: smartagri92/ml
    newName: 111111111111.dkr.ecr.eu-west-3.amazonaws.com/smartagri92/ml
    newTag: 0.0.0-placeholder
  - name: smartagri92/mlflow
    newName: 111111111111.dkr.ecr.eu-west-3.amazonaws.com/smartagri92/mlflow
    newTag: 0.0.0-placeholder
  - name: smartagri92/web
    newName: 111111111111.dkr.ecr.eu-west-3.amazonaws.com/smartagri92/web
    newTag: 0.0.0-placeholder

configMapGenerator:
  - name: agri-config
    namespace: smartagri92
    behavior: merge
    literals:
      - APP_ENV=staging
      - MQTT_URL=mqtts://mqtt.staging.smartagri92.example:8883
      - S3_BUCKET_RAW=smartagri92-staging-raw-222222222222
      - CORS_ORIGINS=https://app.staging.smartagri92.example
  - name: ml-config
    namespace: smartagri92-ml
    behavior: merge
    literals:
      - MLFLOW_ARTIFACTS_DESTINATION=s3://smartagri92-staging-models-222222222222/mlflow/
  - name: inference-bundle
    namespace: smartagri92-ml
    behavior: merge
    literals:
      - MODEL_BUNDLE_URI=s3://smartagri92-staging-models-222222222222/bundles/disease-v0/bundle.tar.gz

patches:
  - path: patches/irsa.yaml
  - path: patches/scale.yaml
  - target:
      kind: Ingress
      name: smartagri92
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: ["api.staging.smartagri92.example", "app.staging.smartagri92.example"]
      - op: replace
        path: /spec/rules/0/host
        value: api.staging.smartagri92.example
      - op: replace
        path: /spec/rules/1/host
        value: app.staging.smartagri92.example
      - op: replace
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-staging
