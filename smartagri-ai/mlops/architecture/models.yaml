    training: "À chaque campagne d'analyses (>= 30 paires capteur-labo par type de sol)"
    inference: {mode: batch, latency: "< 1 min", frequency: "quotidien",
                fallback: "valeurs de laboratoire, sinon iSDAsoil ou SoilGrids"}
    challenge: "Les sondes NPK RS485 bon marché mesurent surtout la conductivité : rester en classes"

