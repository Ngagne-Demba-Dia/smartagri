# Catalogue des MODÈLES (phase 2). Confidentiel - réservé aux partenaires de travail.
# Contrôlé par `python -m agriml.catalog check` (voir ml/catalog/README.md). Champs :
#   use_case        IA-1 … IA-10 | TRANSVERSE (cas d'usage du doc 04)
#   kind            nature de la variante « production » : rules | physical | statistics | ml | deep_learning
#                   | llm | optimisation
#   version         première version livrée : MVP | V1.1 | V2 | V3
#   platform        web:N (module web 1–13, doc 10 §3) | mobile | kit | partner
#   data            jeux curated ou features (jamais raw) : mandatory | recommended | optional ;
#                   un jeu research_only n'est admis qu'en optional
#   candidates      les trois variantes : competition | production | compromis
#   inference.mode  batch | online | edge | stream ; fallback = repli si le modèle est indisponible ou hors seuil
#   pretrained      sources « pretrained » utilisées en production ; pretrained_research : recherche seulement
#   depends_on      modèles amont (version <= celle du modèle)
#   octopus_program programme de agriml/octopus/programs/ ; son jeu doit être obligatoire pour ce modèle
#   challenge       limite ou risque principal à garder en tête

models:
  # ================================================================== IA-1 Irrigation
  - id: irr_et0
    use_case: IA-1
    name: "Évapotranspiration de référence ET0"
    kind: physical
    version: MVP
    platform: [web:5, web:7, mobile]
    data:
      mandatory: [meteo.forecast_asof, meteo.grid_daily]
      recommended: [features.local_weather_bias]
      optional: [iot.telemetry_hourly]
    features: ["Tmin, Tmax", "humidité relative", "vent à 2 m", "rayonnement Rs", "altitude, latitude, jour julien"]
    candidates:
      competition: "Penman-Monteith FAO-56 sur prévision multi-modèles corrigée du biais local, Rs CM SAF"
      production: "Penman-Monteith FAO-56 sur IFS (ECMWF Open Data), repli Hargreaves-Samani"
      compromis: "Penman-Monteith FAO-56 sur IFS + biais moyen glissant 30 j par maille"
    metrics:
      primary: "MAE ET0 journalière vs station de référence (mm/j)"
      secondary: ["biais moyen", "MAE par saison (sèche, hivernage)"]
      threshold: "MAE <= 0,6 mm/j sur les stations ANACIM ou TAHMO disponibles"
    training: "Aucun apprentissage ; coefficient Hargreaves et biais Rs étalonnés par zone sur 3 ans ERA5-Land"
    inference: {mode: batch, latency: "< 1 min pour 20 000 parcelles", frequency: "4 fois/j, après chaque émission",
                fallback: "Hargreaves-Samani (Tmin, Tmax), puis climatologie décadaire ERA5-Land"}
    challenge: "Sans station de référence au Sénégal, la MAE n'est mesurable que contre ERA5-Land, lui-même biaisé"

  - id: irr_water_balance
    use_case: IA-1
    name: "Bilan hydrique FAO-56 par parcelle"
    kind: physical
    version: MVP
    platform: [web:3, web:7, mobile, kit]
    data:
      mandatory: [iot.telemetry_hourly, iot.irrigation_events, agronomie.crop_cycles, agronomie.crop_params,
                  sols.field_profile, meteo.forecast_asof, meteo.grid_daily]
      recommended: [features.rain_events, sols.lab_results]
      optional: [satellite.field_indices]
    features: ["Kc par stade", "profondeur racinaire Zr", "fraction p", "TAW et RAW", "pluie efficace 0,8 x P",
               "humidité mesurée pour recalage",
               "seuils conseillés start/stop (CC et PF par pédotransfert)"]
    candidates:
      competition: "FAO-56 double Kc (Kcb + Ke) avec assimilation de l'humidité capteur (filtre de Kalman d'ensemble)"
      production: "FAO-56 Kc simple, recalé chaque jour sur l'humidité mesurée"
      compromis: "Kc simple recalé + Kc dérivé du NDVI dès que Sentinel-2 est disponible"
    metrics:
      primary: "RMSE entre déficit prédit et humidité mesurée à J+1 (points de %)"
      secondary: ["jours en stress (teneur < RAW)", "m³ par tonne récoltée"]
      threshold: "RMSE <= 5 points ; aucune dose hors bornes (0 <= dose <= TAW)"
    training: "Paramètres FAO-56 et ISRA ; p et Zr étalonnés par culture sur les parcelles pilotes"
    inference: {mode: batch, latency: "< 5 min", frequency: "horaire et après chaque émission",
                fallback: "seuils du firmware (threshold_start_pct, threshold_stop_pct)"}
    depends_on: [irr_et0]
    challenge: "Une seule sonde par parcelle : le recalage suppose une parcelle homogène.
      Les seuils conseillés s'affichent sur la page locale du kit à côté du réglage choisi, sans le remplacer"

  - id: soil_nowcast
    use_case: IA-1
    name: "Prévision de l'humidité du sol à 1–48 h"
    kind: ml
    version: V2
    platform: [web:1, web:3, mobile]
    data:
      mandatory: [features.soil_nowcast]
      recommended: [features.local_weather_bias]
      optional: [satellite.field_indices]
    features: ["humidité passée (retards 1–72 h)", "pompe en marche", "pluie, T et HR passées", "ET0 prévue",
               "distance au seuil de démarrage", "capacité au champ, point de flétrissement"]
    candidates:
      competition: "Ensemble LightGBM direct multi-horizon + N-HiTS ou TFT, cible = delta"
      production: "LightGBM multi-horizon (1, 6, 24, 48 h) sur le delta, quantiles p10, p50, p90"
      compromis: "LightGBM global + correction du biais résiduel glissant par kit"
    metrics:
      primary: "RMSE à 24 h (points de %)"
      secondary: ["skill vs persistance par horizon", "couverture de l'intervalle p10–p90"]
      threshold: "skill >= 20 % vs persistance à 24 h sur le holdout figé"
    training: "Mensuel ; validation temporelle groupée par kit (programme OctOpus soil_moisture_nowcast)"
    inference: {mode: batch, latency: "< 2 min", frequency: "horaire",
                fallback: "persistance, puis bilan hydrique irr_water_balance"}
    depends_on: [irr_et0]
    octopus_program: soil_moisture_nowcast
    challenge: "Le jeu existe dès le MVP mais il faut une saison complète (hivernage + saison sèche) pour entraîner"

  - id: irr_need_24h
    use_case: IA-1
    name: "Besoin d'irrigation à 24 h"
    kind: ml
    version: V2
    platform: [web:3, web:7, mobile, kit]
    data:
      mandatory: [features.irrigation_need]
      recommended: [features.local_weather_bias]
      optional: [features.rain_events]
    features: ["ET0, Kc, pluie efficace", "humidité et tendance", "TAW", "NDVI", "culture et stade", "texture du sol",
               "historique de pompage passé"]
    candidates:
      competition: "Stacking LightGBM + CatBoost sur le résidu du bilan FAO-56, contraintes monotones"
      production: "LightGBM sur le résidu (besoin observé − bilan FAO-56), sortie bornée à la capacité au champ"
      compromis: "Bilan FAO-56 + correction LightGBM plafonnée à ±30 %"
    metrics:
      primary: "MAE du besoin à 24 h (mm)"
      secondary: ["biais par culture et par zone", "eau économisée vs parcelle témoin"]
      threshold: "MAE <= 3 mm sur le holdout (programme irrigation_need) ; régression <= 3 % par tranche"
    training: "Hebdomadaire en saison ; validation temporelle purgée (72 h) groupée par parcelle"
    inference: {mode: batch, latency: "< 5 min", frequency: "toutes les 6 h",
                fallback: "irr_water_balance, puis seuils du firmware"}
    depends_on: [irr_et0, irr_water_balance]
    octopus_program: irrigation_need
    challenge: "La cible « besoin observé » dépend du débitmètre (V1.1) : sans lui, elle n'est qu'estimée"

  - id: irr_scheduler
    use_case: IA-1
    name: "Planification de l'irrigation sur 72 h (eau, énergie, tour d'eau)"
    kind: optimisation
    version: V3
    platform: [web:7, web:10, kit]
    data:
      mandatory: [features.irrigation_need, economie.costs]
      recommended: [iot.device_health, features.rain_events]
      optional: [eau.water_quality]
    features: ["besoin prévu", "probabilité de pluie", "tarif énergie par heure", "débit de la pompe",
               "contraintes de tour d'eau et de main-d'œuvre"]
    candidates:
      competition: "MPC stochastique sur scénarios de pluie + RL hors ligne évalué de façon contrefactuelle"
      production: "MPC déterministe sur 72 h (programmation linéaire, OR-Tools)"
      compromis: "Règles + MPC 48 h, report automatique si P(pluie >= 5 mm) >= 60 %"
    metrics:
      primary: "m³ et kWh par parcelle et par campagne vs témoin"
      secondary: ["jours en stress hydrique", "coût énergie (FCFA)"]
      threshold: "−20 % d'eau sans hausse des jours en stress (essai apparié)"
    training: "Pas d'apprentissage pour le MPC ; le RL reste en recherche"
    inference: {mode: batch, latency: "< 1 min par exploitation", frequency: "toutes les 6 h",
                fallback: "irr_need_24h, puis seuils du firmware"}
    depends_on: [irr_need_24h, soil_nowcast, wx_rain_prob]
    challenge: "Le gain dépend de la flexibilité réelle (tour d'eau, solaire) : à mesurer avant d'optimiser"

  # ================================================================== IA-2 Météo locale
  - id: wx_blend
    use_case: IA-2
    name: "Prévision météo combinée par maille"
    kind: statistics
    version: MVP
    platform: [web:1, web:5, mobile]
    data:
      mandatory: [meteo.forecast_asof]
      recommended: [meteo.grid_daily]
      optional: [meteo.stations_clean]
    features: ["prévisions IFS, AIFS, ICON, GFS par échéance", "heure d'émission", "climatologie de la maille"]
    candidates:
      competition: "EMOS ou régression quantile par maille sur multi-modèles et ensembles ECMWF ENS"
      production: "Moyenne pondérée IFS, ICON, GFS ; poids appris par maille et par échéance sur l'historique as-of"
      compromis: "IFS seul + correction de biais mensuelle contre ERA5-Land"
    metrics:
      primary: "CRPS température et pluie J+1 à J+7"
      secondary: ["MAE Tmax, Tmin", "score de Brier pluie >= 1 mm"]
      threshold: "CRPS <= meilleur modèle brut − 5 %"
    training: "Mensuel, sur prévisions as-of (heure d'émission conservée) pour éviter toute fuite"
    inference: {mode: batch, latency: "< 5 min", frequency: "4 fois/j", fallback: "IFS brut, puis climatologie"}
    challenge: "La vérité terrain est rare : ERA5 et CHIRPS lissent les orages convectifs du Sahel"

  - id: wx_local_bias
    use_case: IA-2
    name: "Correction du biais local au kit"
    kind: ml
    version: V2
    platform: [web:5, mobile, kit]
    data:
      mandatory: [features.local_weather_bias]
      recommended: [meteo.stations_clean]
      optional: [geo.field_context]
    features: ["écart capteur − prévision (T, HR, pression)", "heure, saison", "altitude", "occupation du sol"]
    candidates:
      competition: "Modèle bayésien hiérarchique par kit + krigeage des résidus entre kits"
      production: "Ridge ou LightGBM du résidu par kit, fenêtre glissante 30 j"
      compromis: "Biais moyen glissant par kit et par heure"
    metrics:
      primary: "MAE de la température de l'air à J+1 au kit (°C)"
      secondary: ["gain vs wx_blend"]
      threshold: "−15 % de MAE vs wx_blend"
    training: "Hebdomadaire, fenêtres glissantes"
    inference: {mode: batch, latency: "< 2 min", frequency: "4 fois/j", fallback: "wx_blend sans correction"}
    depends_on: [wx_blend]
    challenge: "Le BME280 dans le boîtier chauffe au soleil : sans abri ventilé, on apprend le biais du boîtier"

  - id: wx_rain_prob
    use_case: IA-2
    name: "Probabilité de pluie utile (>= 5 mm) à 24–72 h"
    kind: ml
    version: V2
    platform: [web:5, web:7, mobile]
    data:
      mandatory: [features.rain_events]
      recommended: [meteo.grid_daily]
      optional: [meteo.seasonal_outlook]
    features: ["fraction des membres ENS au-dessus du seuil", "pluie prévue moyenne", "mois", "zone climatique"]
    candidates:
      competition: "LightGBM multi-seuils sur 50 membres ENS, calibration isotone"
      production: "Régression logistique sur la fraction des membres >= seuil, calibration isotone"
      compromis: "Fraction brute des membres ENS >= seuil"
    metrics:
      primary: "Score de Brier P(pluie >= 5 mm) à 24 et 48 h"
      secondary: ["diagramme de fiabilité", "ROC-AUC"]
      threshold: "BSS >= 0,1 vs climatologie"
    training: "Mensuel ; vérité CHIRPS, IMERG et stations"
    inference: {mode: batch, latency: "< 2 min", frequency: "4 fois/j",
                fallback: "fraction des membres, puis climatologie"}
    depends_on: [wx_blend]
    challenge: "Les ensembles par Open-Meteo exigent l'offre Professional ; ECMWF Open Data ENS est l'alternative"

  # ================================================================== IA-3 Vision
  - id: vis_quality
    use_case: IA-3
    name: "Contrôle qualité des photos avant envoi"
    kind: ml
    version: MVP
    platform: [mobile]
    data:
      mandatory: [images.labelled]
      recommended: []
      optional: [images.public_reference]
    features: ["variance du laplacien (flou)", "histogramme (exposition)", "présence d'un organe végétal", "cadrage"]
    candidates:
      competition: "MobileNetV3 multi-tâche (flou, exposition, organe) distillé d'un ViT"
      production: "Règles d'image + MobileNetV3-Small TFLite int8"
      compromis: "Règles seules au MVP, classifieur dès 2 000 photos annotées"
    metrics:
      primary: "Taux de rejet à tort (%)"
      secondary: ["part de photos inutilisables reçues"]
      threshold: "rejet à tort <= 5 % ; photos inutilisables −50 %"
    training: "Trimestriel ; annotations qualité faites par les conseillers"
    inference: {mode: edge, latency: "< 150 ms sur Android d'entrée de gamme", frequency: "à chaque photo",
                fallback: "photo acceptée avec un drapeau qualité"}
    pretrained: [vision_backbones]
    challenge: "Le rejet doit rester explicable à l'écran (« trop flou ») sinon l'utilisateur abandonne"

  - id: vis_disease
    use_case: IA-3
    name: "Diagnostic de maladies et ravageurs sur photo"
    kind: deep_learning
    version: V2
    platform: [web:8, mobile, kit]
    data:
      mandatory: [features.disease_images]
      recommended: [phyto.reference]
      optional: [features.pest_risk]
    features: ["image recadrée 224–384 px", "culture déclarée", "stade", "risque régional (a priori)"]
    candidates:
      competition: "Ensemble ConvNeXt, EfficientNetV2 et ViT (DINOv2 affiné), TTA, calibration"
      production: "EfficientNet-B0 ou MobileNetV3 affiné, ONNX ou TFLite int8, seuil d'abstention"
      compromis: "EfficientNet-B3 serveur + MobileNetV3 mobile ; abstention transmise au conseiller"
    metrics:
      primary: "F1 macro sur le holdout terrain"
      secondary: ["rappel de la classe « malade »", "ECE (calibration)", "taux d'abstention"]
      threshold: "F1 macro >= 0,80 ; rappel malade >= 0,90 ; ECE <= 0,05"
    training: "Mensuel en saison ; StratifiedGroupKFold par plante ; double étiquetage par deux conseillers"
    inference: {mode: online, latency: "< 2 s serveur, < 300 ms mobile", frequency: "à la demande",
                fallback: "diagnostic par un conseiller (file d'attente) + fiche générique"}
    pretrained: [vision_backbones]
    octopus_program: disease_image_classification
    challenge: "PlantVillage est photographié en laboratoire : sans photos de terrain locales, le F1 s'effondre.
      Le kit affiche seulement le verdict mis en cache (confiance calibrée, version, date), jamais calculé à bord"

  - id: vis_pest_count
    use_case: IA-3
    name: "Comptage d'insectes sur pièges photographiés"
    kind: deep_learning
    version: V3
    platform: [web:8, kit]
    data:
      mandatory: [features.pest_trap_images]
      recommended: [phyto.reference]
      optional: []
    features: ["image du piège (ESP32-CAM)", "espèce ciblée par la phéromone", "date de pose"]
    candidates:
      competition: "Détection RT-DETR + comptage par carte de densité"
      production: "Détecteur léger sous licence permissive (RT-DETR Apache-2.0), comptage par piège"
      compromis: "Classifieur présence/absence + comptage manuel assisté dans l'app"
    metrics:
      primary: "MAE du comptage par piège"
      secondary: ["mAP@0,5"]
      threshold: "MAE <= 2 insectes ou <= 15 %"
    training: "Par campagne ; boîtes annotées sur 1 000 images minimum"
    inference: {mode: batch, latency: "< 10 s par image", frequency: "4 fois/j", fallback: "comptage manuel"}
    pretrained: [vision_backbones]
    challenge: "Les détecteurs YOLO d'Ultralytics sont sous AGPL-3.0 : exclus sans licence commerciale"

  - id: vis_canopy
    use_case: IA-3
    name: "Couverture végétale et vigueur sur images du kit"
    kind: statistics
    version: V2
    platform: [web:4, web:6]
    data:
      mandatory: [images.espcam_series]
      recommended: [satellite.field_indices]
      optional: [images.drone_mosaics]
    features: ["indice ExG et ExGR", "fraction de couvert", "tendance sur 7 j"]
    candidates:
      competition: "Segmentation SegFormer ou U-Net végétation/sol + suivi temporel"
      production: "ExG + seuillage d'Otsu, suivi de la fraction de couvert"
      compromis: "ExG puis U-Net léger dès 500 masques annotés"
    metrics:
      primary: "IoU végétation"
      secondary: ["corrélation fraction de couvert vs NDVI Sentinel-2"]
      threshold: "IoU >= 0,8"
    training: "Aucun pour ExG ; U-Net trimestriel"
    inference: {mode: batch, latency: "< 1 s par image", frequency: "4 fois/j", fallback: "NDVI Sentinel-2 seul"}
    challenge: "Ombres et sol humide trompent ExG : prendre les photos à heure fixe"

  # ================================================================== IA-4 Risques phytosanitaires
  - id: risk_rules
    use_case: IA-4
    name: "Alertes phytosanitaires par règles expertes"
    kind: rules
    version: V1.1
    platform: [web:7, web:8, mobile]
    data:
      mandatory: [meteo.forecast_asof, agronomie.crop_cycles, phyto.reference]
      recommended: [phyto.outbreaks]
      optional: [meteo.grid_daily]
    features: ["T, HR, pluie, durée d'humectation estimée", "culture et stade", "alertes officielles de la zone"]
    candidates:
      competition: "Règles + modèle d'humectation foliaire calibré sur capteurs"
      production: "Règles ISRA et DPV : seuils T, HR, pluie × stade × culture"
      compromis: "Règles + relais des alertes DPV et FAMEWS par zone"
    metrics:
      primary: "Précision des alertes (% confirmées par observation)"
      secondary: ["rappel sur foyers signalés", "alertes par parcelle et par saison"]
      threshold: "précision >= 50 % ; <= 3 alertes par parcelle et par mois"
    training: "Révision des seuils chaque campagne avec les agronomes"
    inference: {mode: batch, latency: "< 1 min", frequency: "quotidien", fallback: "relais des alertes DPV"}
    challenge: "Trop d'alertes = alertes ignorées : le plafond mensuel est une exigence, pas un réglage"

  - id: pest_phenology
    use_case: IA-4
    name: "Développement des ravageurs par degrés-jours"
    kind: physical
    version: V2
    platform: [web:8, mobile]
    data:
      mandatory: [meteo.grid_daily, phyto.reference, agronomie.crop_cycles]
      recommended: [features.local_weather_bias]
      optional: [phyto.outbreaks]
    features: ["degrés-jours cumulés (seuils de littérature)", "date de semis", "premières captures"]
    candidates:
      competition: "Modèles à distribution de retard calibrés sur pièges"
      production: "Degrés-jours par ravageur (chenille légionnaire, Tuta absoluta, mouche des fruits)"
      compromis: "Degrés-jours recalés sur la première capture"
    metrics:
      primary: "Erreur sur la date du pic de vol (jours)"
      secondary: ["date de la 1re génération"]
      threshold: "<= 7 jours"
    training: "Seuils de littérature ; recalage par campagne"
    inference: {mode: batch, latency: "< 1 min", frequency: "quotidien", fallback: "calendrier de risque régional"}
    depends_on: [wx_blend]
    challenge: "Seuils thermiques publiés hors Sahel : à valider avec l'ISRA"

  - id: pest_risk_ml
    use_case: IA-4
    name: "Probabilité de foyer à 7 jours"
    kind: ml
    version: V2
    platform: [web:4, web:8, mobile]
    data:
      mandatory: [features.pest_risk]
      recommended: [features.rain_events]
      optional: [features.pest_trap_images]
    features: ["météo passée et prévue", "foyers voisins (distance, date)", "NDVI", "culture, stade", "degrés-jours"]
    candidates:
      competition: "Modèle spatio-temporel (GNN sur graphe de parcelles) + LightGBM"
      production: "LightGBM calibré P(foyer à 7 j) par couple culture-ravageur"
      compromis: "Régression logistique pénalisée + règles en garde-fou"
    metrics:
      primary: "PR-AUC P(foyer à 7 j)"
      secondary: ["score de Brier", "précision dans le top 10 %"]
      threshold: "PR-AUC >= 2 × prévalence et précision >= risk_rules"
    training: "Mensuel en saison ; validation spatiale par blocs et temporelle"
    inference: {mode: batch, latency: "< 2 min", frequency: "quotidien", fallback: "risk_rules"}
    depends_on: [pest_phenology]
    challenge: "Les absences de foyer ne sont pas observées : biais de signalement à corriger"

  # ================================================================== IA-5 Assistant
  - id: asst_llm
    use_case: IA-5
    name: "Assistant agronomique conversationnel"
    kind: llm
    version: MVP
    platform: [web:12, mobile]
    data:
      mandatory: [connaissances.rag_chunks]
      recommended: [agronomie.crop_cycles, meteo.forecast_asof]
      optional: [features.rain_events]
    features: ["passages récupérés et cités", "contexte de la parcelle (culture, stade)", "outils météo et bilan"]
    candidates:
      competition: "claude-opus-5-5, raisonnement adaptatif, outils et citations"
      production: "claude-opus-5-5 avec RAG, outils bornés, réponses citées, cache de prompt"
      compromis: "claude-haiku-5-5 pour les questions fréquentes, routage vers claude-opus-5-5 si complexe"
    metrics:
      primary: "Exactitude agronomique notée par les agronomes (% correct et sûr)"
      secondary: ["citations valides", "taux d'escalade", "coût par question", "latence p95"]
      threshold: ">= 90 % correct ; 0 produit non homologué CSP recommandé"
    training: "Pas d'entraînement : prompts, corpus et outils versionnés ; évaluation hebdomadaire"
    inference: {mode: online, latency: "p95 < 8 s en streaming", frequency: "à la demande",
                fallback: "FAQ validées + escalade vers un conseiller"}
    pretrained: [claude_api]
    depends_on: [asst_retrieval, asst_guard]
    challenge: "Le contexte de parcelle part vers l'API hors du Sénégal : minimiser et encadrer le transfert"

  - id: asst_retrieval
    use_case: IA-5
    name: "Recherche documentaire du RAG"
    kind: ml
    version: MVP
    platform: [web:12, mobile]
    data:
      mandatory: [connaissances.rag_chunks]
      recommended: [langue.assistant_eval]
      optional: []
    features: ["BM25", "embeddings multilingues", "filtres culture, zone, saison", "date de la fiche"]
    candidates:
      competition: "Hybride BM25 + embeddings + reranker cross-encoder affiné"
      production: "Hybride BM25 + embeddings multilingues auto-hébergés, filtres de métadonnées"
      compromis: "BM25 + métadonnées seulement au MVP"
    metrics:
      primary: "Recall@5 sur les questions de référence"
